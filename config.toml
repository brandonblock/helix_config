theme = "boo_berry"

[editor]
gutters = ["diff", "diagnostics", "line-numbers", "spacer"]

[editor.cursor-shape]
insert = "bar"
normal = "block"
select = "underline"

# ============================================
# Remaps for Colemak-DH / Miryoku
# ============================================

# ============================================
# Normal mode
# ============================================

[keys.normal]
# Movement (neio = hjkl)
n = "move_char_left"
e = "move_visual_line_down"
i = "move_visual_line_up"
o = "move_char_right"

# Find char
a = "find_prev_char"
A = "till_prev_char"
t = "find_next_char"
T = "find_till_char"

# Word nav
r = "move_prev_word_start"
R = "move_prev_long_word_start"
s = "move_next_word_end"
S = "move_next_long_word_end"
"," = "move_next_word_start"
"<" = "move_next_long_word_start"

# Displaced functions
h = "search_next"
H = "search_prev"
l = "insert_mode"
L = "insert_at_line_start"
u = "append_mode"
U = "insert_at_line_end"
k = "open_below"
K = "open_above"
j = "undo"
J = "redo"
f = "select_regex"
F = "split_selection"
b = "move_parent_node_start"
B = "move_parent_node_end"
w = "copy_selection_on_next_line"
W = "copy_selection_on_prev_line"
"esc" = "keep_primary_selection"

# Copy/paste
"'" = "replace"
"A-p" = "replace_with_yanked"
d = "delete_selection_noyank"
"A-y" = "delete_selection"
c = "change_selection_noyank"
"A-c" = "change_selection"

# Jumplist
"A-n" = "jump_backward"
"A-o" = "jump_forward"

# ============================================
# Select mode
# ============================================

[keys.select]
# Movement (neio = hjkl)
n = "extend_char_left"
e = "extend_line_down"
i = "extend_line_up"
o = "extend_char_right"

# Find char
a = "extend_prev_char"
A = "extend_till_prev_char"
t = "extend_next_char"
T = "extend_till_char"

# Word nav
r = "extend_prev_word_start"
R = "extend_prev_long_word_start"
s = "extend_next_word_end"
S = "extend_next_long_word_end"
"," = "extend_next_word_start"
"<" = "extend_next_long_word_start"

# Displaced functions
h = "search_next"
H = "search_prev"
l = "insert_mode"
L = "insert_at_line_start"
u = "append_mode"
U = "insert_at_line_end"
k = "open_below"
K = "open_above"
j = "undo"
J = "redo"
f = "select_regex"
F = "split_selection"
b = "extend_parent_node_start"
B = "extend_parent_node_end"
w = "copy_selection_on_next_line"
W = "copy_selection_on_prev_line"

# Copy/paste
"'" = "replace"
"A-p" = "replace_with_yanked"
d = "delete_selection_noyank"
"A-y" = "delete_selection"
c = "change_selection_noyank"
"A-c" = "change_selection"

# ============================================
# Goto mode (g prefix)
# ============================================

[keys.normal.g]
n = "goto_line_start"
o = "goto_line_end"
e = "move_line_down"
i = "move_line_up"
G = "goto_last_line"
I = "goto_implementation"
N = "goto_next_buffer"

[keys.select.g]
n = "extend_to_line_start"
o = "extend_to_line_end"
e = "extend_line_down"
i = "extend_line_up"
g = "extend_to_file_start"
G = "extend_to_file_end"
I = "goto_implementation"
N = "goto_next_buffer"

# ============================================
# View mode (z prefix)
# ============================================

[keys.normal.z]
e = "scroll_down"
i = "scroll_up"

# ============================================
# Window mode (Ctrl-w and Space-w)
# ============================================

[keys.normal.C-w]
n = "jump_view_left"
e = "jump_view_down"
i = "jump_view_up"
o = "jump_view_right"
N = "swap_view_left"
E = "swap_view_down"
I = "swap_view_up"
O = "swap_view_right"
"C-o" = "wonly"

[keys.normal.space.w]
n = "jump_view_left"
e = "jump_view_down"
i = "jump_view_up"
o = "jump_view_right"
N = "swap_view_left"
E = "swap_view_down"
I = "swap_view_up"
O = "swap_view_right"
"C-o" = "wonly"
